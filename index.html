<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>1939 Gym Bros</title>
  <link rel="icon" href="assets/icon-192.png?v=3">
  <link rel="apple-touch-icon" href="assets/icon.png?v=3">
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <meta name="apple-mobile-web-app-title" content="Gym Bros">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css?v=33">
</head>
<body>
  <header>
    <button id="sync" class="btn small" hidden></button>
    <button id="lock" class="btn small">Unlock</button>
  </header>

  <main id="app"></main>

  <dialog id="login">
    <form id="login-form">
      <h2>Group password</h2>
      <p class="muted">You only have to enter it once per phone.</p>
      <input type="password" id="pw" autocomplete="current-password" required>
      <p class="error-text" id="login-err"></p>
      <div class="row end">
        <button type="button" class="btn" id="login-cancel">Cancel</button>
        <button class="btn primary">Unlock</button>
      </div>
    </form>
  </dialog>

  <!-- Summary shown after completing an exercise or a workout -->
  <dialog id="sheet" class="sheet">
    <canvas id="sheet-confetti"></canvas>
    <form method="dialog">
      <div id="sheet-body"></div>
      <button class="btn primary big">Close</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="config.js?v=33"></script>
  <script src="app.js?v=33"></script>
</body>
</html>
