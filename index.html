<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1216">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>1939 Gym Bros</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a href="#/" class="logo" id="logo">1939 Gym Bros</a>
    <button id="lock" class="btn small">Unlock</button>
  </header>

  <main id="app"></main>

  <dialog id="login">
    <form id="login-form">
      <h2>Group password</h2>
      <p class="muted">Needed to save changes. You only have to enter it once per phone.</p>
      <input type="password" id="pw" autocomplete="current-password" required>
      <p class="error-text" id="login-err"></p>
      <div class="row end">
        <button type="button" class="btn" id="login-cancel">Cancel</button>
        <button class="btn primary">Unlock</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
