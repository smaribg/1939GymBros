<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e0e">
  <title>Weight buttons preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css?v=31">
  <style>
    /* Preview only: three ways to change kg without the keyboard */
    .variants { display: flex; width: 100%; margin: 4px 0 6px; }
    .variants button { flex: 1; }
    .about { color: var(--muted); font-size: 14px; margin: 0 0 14px; min-height: 40px; }

    /* A: chips that add or take off kg */
    .chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 2px 0 6px; }
    .chip {
      min-height: 46px; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
      background: var(--kg-bg); border: 1px solid var(--kg-border); color: var(--text);
    }
    .chip.minus { background: transparent; color: var(--kg); }
    .chip:active { filter: brightness(1.3); }
    .chips.reps { grid-template-columns: repeat(4, 1fr); }
    .chips.reps .chip { background: #242424; border-color: #2e2e2e; }
    .chips.reps .chip.minus { background: transparent; color: var(--muted); }
    .chip-label { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; margin: 10px 0 4px; }

    /* B: big steppers */
    .stepper-box { display: grid; gap: 10px; margin: 6px 0 4px; }
    .big-stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; align-items: center; border-radius: 16px; padding: 8px; }
    .big-stepper.kg { background: var(--kg-bg); border: 1px solid var(--kg-border); }
    .big-stepper.reps { background: #242424; border: 1px solid #2e2e2e; }
    .big-stepper button {
      height: 56px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(0, 0, 0, 0.25);
      color: var(--text); font: inherit; font-size: 28px; font-weight: 600; cursor: pointer;
    }
    .big-stepper button:active { background: rgba(255, 255, 255, 0.1); }
    .big-stepper .value { text-align: center; line-height: 1; }
    .big-stepper .value input { background: transparent; border: none; box-shadow: none; text-align: center; font-size: 34px; font-weight: 700; padding: 0; min-height: 40px; }
    .big-stepper .value span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
    .step-size { display: flex; gap: 6px; justify-content: center; align-items: center; color: var(--muted); font-size: 13px; }
    .step-size .seg { margin: 0; }

    /* C: pick a weight from a strip */
    .strip { display: flex; gap: 6px; overflow-x: auto; margin: 4px -20px 6px; padding: 4px 20px; scrollbar-width: none; scroll-snap-type: x mandatory; }
    .strip::-webkit-scrollbar { display: none; }
    .strip button {
      flex: none; min-width: 64px; min-height: 52px; border-radius: 12px; scroll-snap-align: center;
      background: transparent; border: 1px solid var(--kg-border); color: var(--kg); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
    }
    .strip button.on { background: var(--kg-bg); color: var(--text); border-color: var(--kg); box-shadow: 0 0 0 1px var(--kg); }
    .strip button small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <main>
    <h1 style="font-size:30px">Weight buttons</h1>
    <p class="sub">Preview only, nothing is saved. Try each version, then tell me which you like.</p>
    <div class="seg variants" data-variants>
      <button data-v="A" class="on">A · Chips</button>
      <button data-v="B">B · Steppers</button>
      <button data-v="C">C · Strip</button>
    </div>
    <p class="about" data-about></p>
    <div data-step></div>
  </main>
  <div id="toast" class="toast" role="status"></div>

  <script>
    const TICK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    const ABOUT = {
      A: 'Buttons under the set that add or take off kg (and reps). You can still tap the box to type.',
      B: 'The current set gets big − / + buttons. Choose how much one tap changes the kg. Tap the number to type.',
      C: 'Swipe a strip of weights around the current one and tap the one you lifted. Last time is marked.',
    };
    const prev = [{ w: 40, r: 10 }, { w: 42.5, r: 8 }, { w: 42.5, r: 8 }, { w: 45, r: 6 }];
    let variant = 'A', stepSize = 5;
    let sets, cur;
    function reset() {
      sets = prev.map(p => ({ w: p.w, r: p.r, done: false }));
      sets[0].done = true;
      cur = 1;
    }
    reset();

    const fmt = n => String(Math.round(n * 100) / 100);
    const el = document.querySelector('[data-step]');

    function row(s, j) {
      const cells = `<span class="set-no">${j + 1}</span><span class="prev">${prev[j].w}kg × ${prev[j].r}</span>`;
      if (j === cur) return `
        <div class="set-row current">
          ${cells}
          <input inputmode="decimal" data-f="w" value="${fmt(s.w)}" aria-label="Weight">
          <input inputmode="numeric" data-f="r" value="${s.r}" aria-label="Reps">
          <span class="tick">${TICK}</span>
        </div>`;
      return `
        <div class="set-row ${s.done ? 'done' : 'upcoming'}">
          ${cells}<span class="val">${fmt(s.w)}</span><span class="val">${s.r}</span><span class="tick">${TICK}</span>
        </div>`;
    }

    function controls() {
      const s = sets[cur];
      if (variant === 'A') return `
        <div class="chip-label">kg</div>
        <div class="chips">
          <button class="chip minus" data-add="-5">−5</button>
          <button class="chip minus" data-add="-2.5">−2.5</button>
          <button class="chip" data-add="2.5">+2.5</button>
          <button class="chip" data-add="5">+5</button>
          <button class="chip" data-add="10">+10</button>
        </div>
        <div class="chip-label">reps</div>
        <div class="chips reps">
          <button class="chip minus" data-rep="-2">−2</button>
          <button class="chip minus" data-rep="-1">−1</button>
          <button class="chip" data-rep="1">+1</button>
          <button class="chip" data-rep="2">+2</button>
        </div>`;
      if (variant === 'B') return `
        <div class="stepper-box">
          <div class="big-stepper kg">
            <button data-add="${-stepSize}" aria-label="Less kg">−</button>
            <div class="value"><input inputmode="decimal" data-f="w" value="${fmt(s.w)}" aria-label="Weight"><span>kg</span></div>
            <button data-add="${stepSize}" aria-label="More kg">+</button>
          </div>
          <div class="step-size">One tap =
            <div class="seg">${[1.25, 2.5, 5, 10].map(n => `<button data-size="${n}" class="${n === stepSize ? 'on' : ''}">${n} kg</button>`).join('')}</div>
          </div>
          <div class="big-stepper reps">
            <button data-rep="-1" aria-label="Fewer reps">−</button>
            <div class="value"><input inputmode="numeric" data-f="r" value="${s.r}" aria-label="Reps"><span>reps</span></div>
            <button data-rep="1" aria-label="More reps">+</button>
          </div>
        </div>`;
      // C: weights around the current one, every 2.5 kg
      const opts = [];
      for (let w = Math.max(0, s.w - 20); w <= s.w + 30; w += 2.5) opts.push(w);
      return `
        <div class="chip-label">kg · swipe for more</div>
        <div class="strip" data-strip>${opts.map(w => `
          <button data-set="${w}" class="${w === s.w ? 'on' : ''}">${fmt(w)}${w === prev[cur].w ? '<small>last time</small>' : ''}</button>`).join('')}
        </div>
        <div class="chip-label">reps</div>
        <div class="chips reps">
          <button class="chip minus" data-rep="-2">−2</button>
          <button class="chip minus" data-rep="-1">−1</button>
          <button class="chip" data-rep="1">+1</button>
          <button class="chip" data-rep="2">+2</button>
        </div>`;
    }

    function render() {
      document.querySelector('[data-about]').textContent = ABOUT[variant];
      if (cur >= sets.length) {
        el.innerHTML = `
          <div class="step">
            <div class="step-name">All done 💪</div>
            <button class="btn primary big" data-again>Try again</button>
          </div>`;
        return;
      }
      el.innerHTML = `
        <div class="step">
          <div class="step-meta">Set ${cur + 1} of ${sets.length}</div>
          <div class="step-name">Siggi</div>
          <div class="set-head"><span>Set</span><span>Previous</span><span>kg</span><span>Reps</span><span>${TICK}</span></div>
          ${sets.map(row).join('')}
          ${controls()}
          <button class="btn primary big" data-next>Next →<small>Gummi · set ${cur + 1}</small></button>
        </div>`;
      // Keep the picked weight in view on the strip
      el.querySelector('[data-strip] .on')?.scrollIntoView({ inline: 'center', block: 'nearest' });
    }

    let toastTimer;
    function toast(text) {
      const t = document.getElementById('toast');
      t.textContent = text;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
    }

    // Only update the values on screen, so a tap doesn't redraw (and scroll) the whole card
    function refreshValues() {
      const s = sets[cur];
      el.querySelectorAll('[data-f="w"]').forEach(i => { if (document.activeElement !== i) i.value = fmt(s.w); });
      el.querySelectorAll('[data-f="r"]').forEach(i => { if (document.activeElement !== i) i.value = s.r; });
      el.querySelectorAll('[data-strip] button').forEach(b => b.classList.toggle('on', +b.dataset.set === s.w));
    }

    el.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      const s = sets[cur];
      if (b.dataset.add) { s.w = Math.max(0, s.w + +b.dataset.add); refreshValues(); }
      else if (b.dataset.rep) { s.r = Math.max(0, s.r + +b.dataset.rep); refreshValues(); }
      else if (b.dataset.set) { s.w = +b.dataset.set; refreshValues(); }
      else if (b.dataset.size) { stepSize = +b.dataset.size; render(); }
      else if (b.hasAttribute('data-next')) {
        s.done = true;
        toast(`Saved ${fmt(s.w)}kg × ${s.r}`);
        cur++;
        if (sets[cur]) { sets[cur].w = Math.max(sets[cur].w, s.w); }
        render();
      } else if (b.hasAttribute('data-again')) { reset(); render(); }
    });
    el.addEventListener('input', e => {
      const v = parseFloat(e.target.value.replace(',', '.'));
      if (!Number.isFinite(v)) return;
      if (e.target.dataset.f === 'w') sets[cur].w = v; else sets[cur].r = v;
      refreshValues();
    });
    el.addEventListener('focusin', e => { if (e.target.matches('input')) e.target.select(); });

    document.querySelector('[data-variants]').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      variant = b.dataset.v;
      document.querySelectorAll('[data-variants] button').forEach(x => x.classList.toggle('on', x === b));
      reset();
      render();
    });
    render();
  </script>
</body>
</html>
