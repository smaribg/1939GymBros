<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e0e">
  <title>Weight buttons preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css?v=31">
  <style>
    /* Preview only: tap the kg / reps box to get buttons for it */
    .variants { display: flex; width: 100%; margin: 4px 0 6px; }
    .variants button { flex: 1; }
    .about { color: var(--muted); font-size: 14px; margin: 0 0 14px; min-height: 40px; }

    .step { position: relative; }
    /* the kg / reps boxes of the current set are buttons now */
    .set-row .cell {
      min-height: 48px; border-radius: 10px; font: inherit; font-size: 20px; font-weight: 700; color: var(--text); cursor: pointer;
    }
    .set-row .cell.kg { background: var(--kg-bg); border: 1px solid var(--kg-border); }
    .set-row .cell.reps { background: #242424; border: 1px solid #2e2e2e; }
    .set-row .cell.open { border-color: var(--cream); box-shadow: 0 0 0 2px var(--cream); }

    /* the panel */
    .pad { background: #1c1c1c; border: 1px solid #343130; border-radius: 18px; padding: 12px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6); }
    .pad-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .pad-head .label { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
    .pad-head .value { font-size: 30px; font-weight: 700; line-height: 1; }
    .pad-head .value small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 3px; }
    .pad-head .kbd { margin-left: auto; display: inline-flex; flex-direction: row; gap: 6px; }
    .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 6px; }
    .chip {
      min-height: 50px; border-radius: 12px; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer;
      background: var(--kg-bg); border: 1px solid var(--kg-border); color: var(--text);
    }
    .chip.minus { background: transparent; color: var(--kg); }
    .pad.reps .chip { background: #2a2a2a; border-color: #363636; }
    .pad.reps .chip.minus { background: transparent; color: var(--muted); }
    .chip:active { filter: brightness(1.35); }
    .pad .btn.primary { width: 100%; margin-top: 6px; min-height: 48px; }
    .pad input { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 6px; }

    /* pop-up: right under the set row, with a little arrow */
    .pop { position: absolute; left: 12px; right: 12px; z-index: 5; }
    .pop::before {
      content: ''; position: absolute; top: -7px; left: var(--arrow, 50%); width: 12px; height: 12px; margin-left: -6px;
      background: #1c1c1c; border-left: 1px solid #343130; border-top: 1px solid #343130; transform: rotate(45deg);
    }

    /* bottom sheet */
    .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.45); }
    .sheet-pad {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 640px; margin: 0 auto;
      border-radius: 22px 22px 0 0; padding: 14px 16px; padding-bottom: max(16px, env(safe-area-inset-bottom));
      animation: up 0.18s ease-out;
    }
    .sheet-pad .chip { min-height: 56px; font-size: 18px; }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  </style>
</head>
<body>
  <main>
    <h1 style="font-size:30px">Weight buttons</h1>
    <p class="sub">Preview only, nothing is saved. Tap the kg or reps box of the orange set.</p>
    <div class="seg variants" data-variants>
      <button data-v="pop" class="on">Pop-up</button>
      <button data-v="sheet">From the bottom</button>
    </div>
    <p class="about" data-about></p>
    <div data-step></div>
  </main>
  <div data-overlay></div>
  <div id="toast" class="toast" role="status"></div>

  <script>
    const TICK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    const KBD = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h1M10.5 10h1M14.5 10h1M6.5 14h11"/></svg>';
    const ABOUT = {
      pop: 'A small panel opens right under the set. Tap outside it (or Done) to close.',
      sheet: 'A panel slides up from the bottom, where your thumb is. Tap above it (or Done) to close.',
    };
    const STEPS = { w: [-10, -6, -5, -1, 1, 5, 6, 10], r: [-2, -1, 1, 2] };
    const prev = [{ w: 40, r: 10 }, { w: 42.5, r: 8 }, { w: 42.5, r: 8 }, { w: 45, r: 6 }];
    let variant = 'pop';
    let sets, cur, open = null, typing = false; // open: 'w' | 'r'

    function reset() {
      sets = prev.map(p => ({ w: p.w, r: p.r, done: false }));
      sets[0].done = true;
      cur = 1;
      open = null;
    }
    reset();

    const fmt = n => String(Math.round(n * 100) / 100);
    const el = document.querySelector('[data-step]');
    const overlay = document.querySelector('[data-overlay]');

    function row(s, j) {
      const cells = `<span class="set-no">${j + 1}</span><span class="prev">${prev[j].w}kg × ${prev[j].r}</span>`;
      if (j === cur) return `
        <div class="set-row current" data-current>
          ${cells}
          <button class="cell kg ${open === 'w' ? 'open' : ''}" data-open="w">${fmt(s.w)}</button>
          <button class="cell reps ${open === 'r' ? 'open' : ''}" data-open="r">${s.r}</button>
          <span class="tick">${TICK}</span>
        </div>`;
      return `
        <div class="set-row ${s.done ? 'done' : 'upcoming'}">
          ${cells}<span class="val">${fmt(s.w)}</span><span class="val">${s.r}</span><span class="tick">${TICK}</span>
        </div>`;
    }

    function padHtml(cls) {
      const s = sets[cur], f = open;
      const v = f === 'w' ? s.w : s.r;
      return `
        <div class="pad ${f === 'w' ? 'kg' : 'reps'} ${cls}" data-pad>
          <div class="pad-head">
            <span class="label">${f === 'w' ? 'Weight' : 'Reps'}</span>
            <span class="value" data-value>${fmt(v)}<small>${f === 'w' ? 'kg' : 'reps'}</small></span>
            <button class="btn small kbd" data-kbd>${KBD}Type</button>
          </div>
          ${typing
            ? `<input inputmode="${f === 'w' ? 'decimal' : 'numeric'}" data-type value="${fmt(v)}">`
            : `${f === 'w'
              ? `<div class="chips">${STEPS.w.slice(0, 4).map(chip).join('')}</div><div class="chips">${STEPS.w.slice(4).map(chip).join('')}</div>`
              : `<div class="chips">${STEPS.r.map(chip).join('')}</div>`}`}
          <button class="btn primary" data-close>Done</button>
        </div>`;
    }
    const chip = n => `<button class="chip ${n < 0 ? 'minus' : ''}" data-add="${n}">${n < 0 ? '−' : '+'}${Math.abs(n)}</button>`;

    function render() {
      document.querySelector('[data-about]').textContent = ABOUT[variant];
      overlay.innerHTML = '';
      if (cur >= sets.length) {
        el.innerHTML = `<div class="step"><div class="step-name">All done 💪</div><button class="btn primary big" data-again>Try again</button></div>`;
        return;
      }
      el.innerHTML = `
        <div class="step">
          <div class="step-meta">Set ${cur + 1} of ${sets.length}</div>
          <div class="step-name">Siggi</div>
          <div class="set-head"><span>Set</span><span>Previous</span><span>kg</span><span>Reps</span><span>${TICK}</span></div>
          ${sets.map(row).join('')}
          <button class="btn primary big" data-next>Next →<small>Gummi · set ${cur + 1}</small></button>
        </div>`;
      if (!open) return;
      if (variant === 'pop') {
        // place it under the current row, arrow pointing at the tapped box
        const step = el.querySelector('.step'), rowEl = el.querySelector('[data-current]'), cell = el.querySelector('.cell.open');
        step.insertAdjacentHTML('beforeend', padHtml('pop'));
        const pad = step.querySelector('[data-pad]');
        const sr = step.getBoundingClientRect(), rr = rowEl.getBoundingClientRect(), cr = cell.getBoundingClientRect();
        pad.style.top = `${rr.bottom - sr.top + 10}px`;
        pad.style.setProperty('--arrow', `${cr.left + cr.width / 2 - sr.left - 12}px`);
      } else {
        overlay.innerHTML = `<div class="scrim" data-close></div>${padHtml('sheet-pad')}`;
      }
      document.querySelector('[data-type]')?.focus();
    }

    let toastTimer;
    function toast(text) {
      const t = document.getElementById('toast');
      t.textContent = text;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
    }

    // Update the numbers without redrawing, so taps don't move anything
    function refreshValues() {
      const s = sets[cur];
      const cellW = el.querySelector('[data-open="w"]'), cellR = el.querySelector('[data-open="r"]');
      if (cellW) cellW.textContent = fmt(s.w);
      if (cellR) cellR.textContent = s.r;
      const val = document.querySelector('[data-value]');
      if (val) val.firstChild.textContent = fmt(open === 'w' ? s.w : s.r);
    }

    document.addEventListener('click', e => {
      const b = e.target.closest('button, .scrim');
      const s = sets[cur];
      // tap outside the pop-up closes it
      if (open && variant === 'pop' && !e.target.closest('[data-pad], [data-open]')) { open = null; typing = false; render(); if (!b) return; }
      if (!b) return;
      const d = b.dataset;
      if (d.open) { open = open === d.open ? null : d.open; typing = false; render(); }
      else if (d.add) {
        if (open === 'w') s.w = Math.max(0, s.w + +d.add); else s.r = Math.max(0, s.r + +d.add);
        refreshValues();
      } else if (b.hasAttribute('data-kbd')) { typing = !typing; render(); }
      else if (b.hasAttribute('data-close')) { open = null; typing = false; render(); }
      else if (b.hasAttribute('data-next')) {
        s.done = true;
        toast(`Saved ${fmt(s.w)}kg × ${s.r}`);
        cur++;
        open = null;
        if (sets[cur]) sets[cur].w = Math.max(sets[cur].w, s.w);
        render();
      } else if (b.hasAttribute('data-again')) { reset(); render(); }
      else if (d.v) {
        variant = d.v;
        document.querySelectorAll('[data-variants] button').forEach(x => x.classList.toggle('on', x === b));
        reset();
        render();
      }
    });
    document.addEventListener('input', e => {
      if (!e.target.matches('[data-type]')) return;
      const v = parseFloat(e.target.value.replace(',', '.'));
      if (!Number.isFinite(v)) return;
      if (open === 'w') sets[cur].w = v; else sets[cur].r = v;
      refreshValues();
    });
    document.addEventListener('focusin', e => { if (e.target.matches('[data-type]')) e.target.select(); });
    document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-type]')) { open = null; typing = false; render(); } });
    render();
  </script>
</body>
</html>
